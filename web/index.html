<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic AI 求职仪表盘</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="logo-area">
                <i class="ph ph-robot"></i>
                <h2>Agentic Assistant</h2>
            </div>
            
            <div class="filters">
                <h3><i class="ph ph-funnel"></i> 岗位过滤</h3>
                
                <div class="filter-group">
                    <label>地点限定</label>
                    <div class="input-wrap">
                        <i class="ph ph-map-pin"></i>
                        <input type="text" id="filter-location" placeholder="例如: 上海">
                    </div>
                </div>

                <div class="filter-group">
                    <label>包含技术栈</label>
                    <div class="input-wrap">
                        <i class="ph ph-code"></i>
                        <input type="text" id="filter-include" placeholder="例如: LLM, NLP">
                    </div>
                </div>

                <div class="filter-group">
                    <label>排除技术栈</label>
                    <div class="input-wrap">
                        <i class="ph ph-x-circle"></i>
                        <input type="text" id="filter-exclude" placeholder="例如: Java, Vue">
                    </div>
                </div>

                <div class="filter-group">
                    <label>排序方式</label>
                    <div class="select-wrap">
                        <i class="ph ph-sort-descending"></i>
                        <select id="sort-type">
                            <option value="default">默认顺序 (抓取先后)</option>
                            <option value="alphabetical">按公司名称排序</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="stats-area">
                <div class="stat-card">
                    <span class="stat-label">符合要求岗位数</span>
                    <span class="stat-value" id="stat-count">0</span>
                </div>
            </div>
            
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-nav glass-panel">
                <div class="nav-text">
                    <h1>AI Engineer 机会全景图</h1>
                    <p>由 Agentic AI 自动寻源并清洗，呈现最原始、准确的算法实习岗位。</p>
                </div>
                <button class="glass-btn" id="refresh-btn">
                    <i class="ph ph-arrows-clockwise"></i> 数据重载
                </button>
            </header>

            <div class="cards-grid" id="jobs-container">
                <div class="loading-state">
                    <i class="ph ph-spinner ph-spin"></i>
                    <p>正在拉取数据...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Web App Logic -->
    <script src="app.js"></script>
</body>
</html>
